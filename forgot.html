<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password | SubTracked</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="login-body" data-page="forgot">
  <header class="navbar transparent">
    <a href="index.html" class="logo">SubTracked</a>
    <nav>
      <a href="info.html">Info</a>
      <a href="login.html">Login</a>
    </nav>
  </header>

  <main class="login-wrap">
    <form class="login-card" onsubmit="requestPasswordReset(event)">
      <p class="tag">Account help</p>
      <h1>Reset password</h1>
      <label for="resetEmail">Account Email</label>
      <input id="resetEmail" type="email" placeholder="you@example.com" required />
      <p id="forgotMessage" class="message hidden"></p>
      <button class="btn full" type="submit">Send Reset Email</button>
      <p class="hint"><a href="login.html">Back to login</a></p>
    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
